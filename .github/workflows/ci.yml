name: HealthVault CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/healthvault?schema=public
      AUTH_SECRET: ci-only-random-test-secret-32-bytes-minimum
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -w @healthvault/api -- --runInBand
      - run: npm run build:api
      - run: npm run build:web
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
          NEXT_PUBLIC_DEV_PASSWORD_AUTH_ENABLED: "false"

  browser:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      NEXT_PUBLIC_DEV_PASSWORD_AUTH_ENABLED: "true"
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/healthvault?schema=public
      AUTH_SECRET: ci-only-random-test-secret-32-bytes-minimum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the web development server
        run: |
          npm run dev:web > /tmp/healthvault-web.log 2>&1 &
          echo $! > /tmp/healthvault-web.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/healthvault-web.log
          exit 1
      - run: npm run test:web
      - if: always()
        run: cat /tmp/healthvault-web.log || true
